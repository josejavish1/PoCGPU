apiVersion: v1
kind: Pod
metadata:
  name: gpu-fabric-audit
  namespace: default
  labels:
    app.kubernetes.io/name: gpu-fabric-audit
spec:
  restartPolicy: Never
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: cuda-toolkit
    image: nvcr.io/nvidia/cuda:12.4.1-devel-ubuntu22.04
    command: ["sleep", "7200"]
    resources:
      limits:
        nvidia.com/gpu: "2"
        memory: "16Gi"
        cpu: "4"
      requests:
        nvidia.com/gpu: "2"
        memory: "8Gi"
        cpu: "2"
    securityContext:
      capabilities:
        add: ["SYS_PTRACE", "IPC_LOCK"]
    volumeMounts:
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
