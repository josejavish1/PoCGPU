apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: default
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        env:
        - name: OPENAI_API_BASE_URL
          value: "http://enterprise-ai-gateway-svc:80/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-platform-secrets
              key: LITELLM_MASTER_KEY
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-platform-secrets
              key: WEBUI_SECRET_KEY
        - name: WEBUI_NAME
          value: "Enterprise AI Copilot"
        - name: ENABLE_SIGNUP
          value: "true"
        - name: DEFAULT_USER_ROLE
          value: "pending"
        - name: ENABLE_COMMUNITY_SHARING
          value: "false"
        - name: DEFAULT_MODELS
          value: "light-model-fast"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: openwebui-storage
          mountPath: /app/backend/data
      volumes:
      - name: openwebui-storage
        persistentVolumeClaim:
          claimName: openwebui-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
  namespace: default
  labels:
    app: open-webui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: open-webui
