apiVersion: v1
kind: Pod
metadata:
  name: linux-client
  namespace: default
  labels:
    app: linux-client
spec:
  restartPolicy: Always
  containers:
  - name: terminal
    image: python:3.11-slim
    command: ["sleep", "86400"]
    env:
    - name: AI_GATEWAY_URL
      value: "http://enterprise-ai-gateway-svc:80/v1"
    - name: AI_API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-platform-secrets
          key: LITELLM_MASTER_KEY
    - name: OPENAI_API_BASE
      value: "http://enterprise-ai-gateway-svc:80/v1"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-platform-secrets
          key: LITELLM_MASTER_KEY
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "200m"
        memory: "256Mi"
