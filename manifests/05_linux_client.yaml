apiVersion: v1
kind: Pod
metadata:
  name: cliente-linux
  namespace: default
  labels:
    app: cliente-linux
spec:
  restartPolicy: Always
  containers:
  - name: terminal
    image: python:3.11-slim
    command: ["sleep", "86400"]
    env:
    - name: AI_GATEWAY_URL
      value: "http://enterprise-ai-gateway-svc:80/v1"
    - name: AI_API_KEY
      value: "sk--ZTZkW7djliQw98HQtgiew"
    - name: OPENAI_API_BASE
      value: "http://enterprise-ai-gateway-svc:80/v1"
    - name: OPENAI_API_KEY
      value: "sk--ZTZkW7djliQw98HQtgiew"
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "200m"
        memory: "256Mi"
