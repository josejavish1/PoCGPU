apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'nvidia-dcgm'
        static_configs:
          - targets: ['10.124.1.3:9400', '10.124.2.2:9400', 'dcgm-exporter-svc.gke-managed-system.svc.cluster.local:9400']
      - job_name: 'vllm-inference'
        static_configs:
          - targets: ['vllm-engine-1-svc:8000', 'vllm-engine-2-svc:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: default
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=7d"
        ports:
        - containerPort: 9090
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  selector:
    app: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus-AI-Cluster
      uid: Prometheus-AI-Cluster
      type: prometheus
      access: proxy
      url: http://prometheus-service:9090
      isDefault: true
      editable: false
    - name: LiteLLM-PostgreSQL
      uid: LiteLLM-PostgreSQL
      type: postgres
      access: proxy
      url: litellm-db-svc:5432
      database: litellm
      user: litellm_admin
      secureJsonData:
        password: "tier1_governance_pass"
      jsonData:
        sslmode: "disable"
        postgresVersion: 1500
      editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      allowUiUpdates: true
      updateIntervalSeconds: 5
      options:
        path: /var/lib/grafana/dashboards
---
