apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-weights-cache-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-weights-preloader
  namespace: default
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: huggingface-downloader
        image: python:3.11-slim
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          pip install --no-cache-dir huggingface_hub[hf_transfer] torch safetensors numpy
          export HF_HUB_ENABLE_HF_TRANSFER=1
          export HF_HOME=/models_cache

          echo "=========================================================="
          echo "PHASE 1: Downloading the Mistral-7B-Instruct-v0.3 base model"
          echo "=========================================================="
          python3 -c "
          from huggingface_hub import snapshot_download
          print('Downloading official Mistral 7B Safetensors weights...')
          snapshot_download(
              repo_id='mistralai/Mistral-7B-Instruct-v0.3',
              local_dir='/models_cache/Mistral-7B-Instruct-v0.3',
              ignore_patterns=['*.bin', '*.pth', '*.pt']
          )
          print('Mistral-7B download completed successfully.')
          "

          echo "=========================================================="
          echo "PHASE 2: Generating LoRA adapters for the Mistral model set"
          echo "=========================================================="
          # Generate adapters structurally compatible with Mistral-7B (32 layers, hidden_size=4096, v_proj=1024)
          python3 -c "
          import os, json, torch
          from safetensors.torch import save_file

          def create_mistral_lora(lora_name, lora_dir):
              os.makedirs(lora_dir, exist_ok=True)
              config = {
                  'base_model_name_or_path': 'mistralai/Mistral-7B-Instruct-v0.3',
                  'bias': 'none',
                  'fan_in_fan_out': False,
                  'inference_mode': True,
                  'init_lora_weights': True,
                  'lora_alpha': 16,
                  'lora_dropout': 0.05,
                  'peft_type': 'LORA',
                  'r': 8,
                  'target_modules': ['q_proj', 'v_proj'],
                  'task_type': 'CAUSAL_LM'
              }
              with open(f'{lora_dir}/adapter_config.json', 'w') as f:
                  json.dump(config, f, indent=2)

              tensors = {}
              # 32 Mistral-7B attention layers
              for layer in range(32):
                  prefix = f'base_model.model.model.layers.{layer}.self_attn'
                  # q_proj (4096 -> 4096)
                  tensors[f'{prefix}.q_proj.lora_A.weight'] = torch.zeros((8, 4096), dtype=torch.bfloat16)
                  tensors[f'{prefix}.q_proj.lora_B.weight'] = torch.zeros((4096, 8), dtype=torch.bfloat16)
                  # v_proj (4096 -> 1024)
                  tensors[f'{prefix}.v_proj.lora_A.weight'] = torch.zeros((8, 4096), dtype=torch.bfloat16)
                  tensors[f'{prefix}.v_proj.lora_B.weight'] = torch.zeros((1024, 8), dtype=torch.bfloat16)

              save_file(tensors, f'{lora_dir}/adapter_model.safetensors')
              print(f'Compatible adapter generated: {lora_name} at {lora_dir}')

          # 1. Deep reasoning and mathematics adapter
          create_mistral_lora('reasoning-math', '/models_cache/loras/reasoning-math')
          # 2. Code generation adapter
          create_mistral_lora('coding-agent', '/models_cache/loras/coding-agent')
          "

          echo "=========================================================="
          echo "VERIFYING FILES IN THE PERSISTENT VOLUME"
          echo "=========================================================="
          ls -lh /models_cache/Mistral-7B-Instruct-v0.3
          ls -lh /models_cache/loras/reasoning-math
          ls -lh /models_cache/loras/coding-agent
          echo "ALL FILES ARE READY FOR VLLM."
        volumeMounts:
        - name: models-storage
          mountPath: /models_cache
      volumes:
      - name: models-storage
        persistentVolumeClaim:
          claimName: llm-weights-cache-pvc
