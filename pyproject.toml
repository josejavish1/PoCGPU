[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pocgpu"
version = "0.1.0"
description = "Governed AI infrastructure economics calculation foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "hypothesis>=6.142,<7",
  "mypy>=1.18,<2",
  "mutmut>=3.3,<4",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src/pocgpu",
  "/schemas",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pocgpu"]

[tool.uv]
required-version = ">=0.13.4,<0.14"
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["pocgpu.domain"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pocgpu", "tests/phase1"]
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mutmut]
source_paths = ["src/pocgpu/domain/"]
pytest_add_cli_args_test_selection = ["tests/phase1/domain/", "tests/phase1/property/"]
mutate_only_covered_lines = true
